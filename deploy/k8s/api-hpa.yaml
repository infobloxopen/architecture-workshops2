apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  # LAB: STEP4 FIXED - HPA configured with proper min/max replicas.
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # LAB: STEP4 FIXED - Target set to 50% for responsive scaling.
          averageUtilization: 50
